spring.datasource.url=jdbc:mysql://localhost:3306/expense-db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8080

# Flyway properties
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/expense-db?useSSL=false&allowPublicKeyRetrieval=true
spring.flyway.password=password
spring.flyway.user=user
spring.flyway.schemas=expense-db
spring.flyway.locations=classpath:db/migration/expense-db

# JWT Configuration
jwt.secret=${SECURITY_SECRET_KEY}