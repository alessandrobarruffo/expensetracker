spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense-db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
server.port=${PORT:8080}

# Flyway properties
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.password=${spring.datasource.password}
spring.flyway.user=${spring.datasource.username}
spring.flyway.schemas=expense-db
spring.flyway.locations=classpath:db/migration/expense-db

# JWT Configuration
jwt.secret=${SECURITY_SECRET_KEY}