# H2 Database Configuration
spring:
  datasource:
    url: jdbc:h2:mem:expensedb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2
  flyway:
    enabled: false

# CORS Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT Configuration
jwt:
  secret: ${SECURITY_SECRET_KEY:dev-default-secret-key-at-least-256-bits-long-for-testing-only-1234567890}

