app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense-db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${PORT:8080}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:19032019}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot
#Flyway properties
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.password=${spring.datasource.password}
spring.flyway.user=${spring.datasource.username}
spring.flyway.schemas=expense-db
spring.flyway.locations=classpath:db/migration/expense-db

# JWT Configuration
jwt.secret=${SECURITY_SECRET_KEY}