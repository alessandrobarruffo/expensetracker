app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173
spring.datasource.url=jdbc:mysql://localhost:3306/expense-db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8080
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=19032019
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot
#Flyway properties
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/expense-db
spring.flyway.password=password
spring.flyway.user=user
spring.flyway.schemas=expense-db
spring.flyway.locations=classpath:db/migration/expense-db

# JWT Configuration
jwt.secret=${SECURITY_SECRET_KEY}